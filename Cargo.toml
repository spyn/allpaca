[workspace]
resolver = "2"
members = [
    "crates/allpaca-types",
    "crates/allpaca-cpu",
    "crates/allpaca-hip",
    "crates/allpaca-cuda",
    "crates/allpaca-vulkan",
    "crates/allpaca-gguf",
    "crates/allpaca-safetensors",
    "crates/allpaca-onnx",
    "crates/allpaca-rpc",
    "crates/allpaca-rpc-server",
    "crates/allpaca-core",
    "crates/allpaca-server",
    "tools/bench",
]
exclude = ["crates/allpaca-shaders"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Heterogeneous research inference engine"

[workspace.dependencies]
allpaca-types = { path = "crates/allpaca-types" }
allpaca-core = { path = "crates/allpaca-core" }
allpaca-gguf = { path = "crates/allpaca-gguf" }
allpaca-safetensors = { path = "crates/allpaca-safetensors" }
allpaca-onnx = { path = "crates/allpaca-onnx" }
allpaca-hip = { path = "crates/allpaca-hip" }
allpaca-cuda = { path = "crates/allpaca-cuda" }
allpaca-vulkan = { path = "crates/allpaca-vulkan" }
allpaca-cpu = { path = "crates/allpaca-cpu" }
allpaca-rpc = { path = "crates/allpaca-rpc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1", features = ["full"] }
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
ahash = "0.8"
memmap2 = "0.9"
rand = { version = "0.8", features = ["small_rng"] }
rust-embed = { version = "8", features = ["mime-guess"] }
sysinfo = "0.33"
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
axum = { version = "0.8", features = ["json"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
futures = "0.3"
async-stream = "0.3"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
llguidance = "1.8"

# rust-gpu nested builds compile rustc_codegen_spirv; keep it optimized.
[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3
