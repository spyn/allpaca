# Allpaca server config (TOML, INI-style sections).
# Precedence: compiled defaults < this file < CLI flags.
#
#   cargo run -p allpaca-server -- --config allpaca.example.toml
#
# Unspecified keys keep compiled defaults. Copy and edit; do not commit secrets.

[http]
host = "127.0.0.1"
port = 8080
# Shared WebUI login and Authorization: Bearer. If omitted, the server prints
# `webui password: …` once to stderr (not tracing / GET /v1/logs). LAN bind
# needs a password (no TLS in v1).
# host = "0.0.0.0"
password = "changeme"
# HTTP API clamp; WebUI slider already maxes at 4096.
# max_tokens = 4096

[model]
id = "allpaca"
# synthetic = true
# path = "models/Llama-3.2-3B-Instruct-Q8_0.gguf"
# HuggingFace Hub id (downloads into HF cache, then loads SafeTensors or GGUF):
# path = "Qwen/Qwen2.5-0.5B-Instruct"
# hf_revision = "main"
# draft_path = "models/Llama-3.2-1B-Instruct-Q8_0.gguf"
# config_path = "models/config.json"
# tokenizer_path = "models/tokenizer.json"

[engine]
scheduler = "adaptive"
target_device = "auto"          # auto | cpu | hip:0 | cuda:0
draft_device = "auto"
cpu_threads = 4
cpu_only = false
# pipeline_mode = "asymmetric"  # asymmetric | symmetric | mobile_tiered
gpu_backend = "auto"            # auto | hip | cpu
max_active_requests = 1
# batch_decode = true          # >1 active: one batched HIP forward per decode tick
poll_schedule = "fair"          # fair | decode_priority | prefill_budget
max_consecutive_prefill_picks = 0
# determinism_seed = 1

[speculative]
enabled = true
providers = ["ngram", "draft_model"]  # ngram | draft_model | mtp | dspark
max_depth = 8
max_concurrent_requests = 3     # speculate only while <= this many Requests are active (0 = always)
min_depth = 2
adaptive = true
ngram_n = 3

[speculative.tree]
enabled = false
max_nodes = 16

[prefill]
chunk_tokens = 512

[kv]
page_tokens = 128
hot_fraction = 0.75
vram_bytes = 4194304
dram_bytes = 33554432
nvme_bytes = 0
# nvme_path = "kv-swap.bin"

[weights]
trunk_bytes = 0
cache_bytes = 0
ring_slots = 2
miss_policy = "qstar"           # qstar | fill | cpu
# RAM budget for experts held on the host. 0 = unlimited for models whose experts
# fit in RAM. For DeepSeek-V4 it is the RAM tier between the GPU caches and the
# model file: 0 = the RAM free at load minus 8 GiB (differs between starts),
# e.g. 53687091200 for a fixed 50 GiB.
host_bytes = 0
# Decode every weight to F32 in RAM whatever the model's size (about 4 bytes
# per weight), so the CPU forward can run it: reference runs and calibration.
host_f32 = false

# Per-model MoE pin-prefer keep-set from `allpaca-server --tune`.
# Lookup key is the unresolved model spec (path or Hub `org/name`).
# [tunes."models/example-moe.gguf"]
# profile = "balanced"
# groups = ["late"]
# ctx_tokens = 32768
# cache_bytes = 8589934592
# keep_experts = [[0, 1], [2]]

[sampling]
mode = "async_host"
pinned_ring_slots = 8
temperature = 0.8
top_k = 40
top_p = 0.95

[structured_output]
enabled = true
json_mode = false
async = false

[multimodal]
# vision_device = "hip:0"
# vision_path = "models/vision.safetensors"
vision_image_size = 64
vision_patch = 16
vision_n_blocks = 0

[rpc]
endpoints = []
# endpoints = ["127.0.0.1:50052"]
# tensor_split = [1.0, 1.0]
max_seq = 2048
# Shared HELLO secret for non-loopback workers (`--rpc-token` / ALLPACA_RPC_TOKEN).
# token = "changeme"

[telemetry]
# otlp_endpoint = "http://127.0.0.1:4318"

[anchors]
slots = 0
token_ids = []

# Prompt cache: earlier prompts' keys, values and recurrent state, so a
# request that shares a prefix skips its prefill.
[prompt_cache]
ram_bytes = 536870912        # 512 MiB
codec = "q8"                 # 1/4 of f32's KV bytes at the same KL; "f32", "f16"; "q4" is lossy
# disk_dir = "cache/prompts" # also keep them on disk, across restarts
disk_bytes = 17179869184     # 16 GiB
worker = false               # keep them on an RPC worker's store instead of disk_dir
boundary_tokens = 2048       # hybrids also keep their state every this many tokens
min_fetch_speedup = 2.0      # read a checkpoint back from disk/worker only if 2x faster than prefill (measured); 0 = always
# DeepSeek-V4 only. true = cut each prefill chunk at the sliding-window stride (128 tokens, not
# prefill.chunk_tokens) and keep a checkpoint there, so a shared prefix resumes. Output stays
# identical to a cold prefill. Cost: more, shorter prefill chunks, RAM (about 13 KB per token plus
# the window rows per checkpoint) and, with disk_dir/worker set, disk writes. The cost is UNMEASURED
# on a real model. false = DSV4 prefills as before and keeps no prompt cache (RAM, disk or worker).
dsv4_window_checkpoints = false

[early_exit]
enabled = false
min_confidence = 0.9
min_calibration_margin = 0.05

# EXPERIMENTAL: techniques that leave the exact-output path. Every option is
# off by default, a run with one on is reported as `lossy` (or
# `distribution-exact`) in the startup log, /stats and every bench sample, and
# the option is part of the prompt-cache key.
[experimental]
# Route-tail skip (Strata): on a block whose routed experts are NOT resident
# on the GPU (host RAM, SSD tier, RPC worker), drop an expert that misses the
# cache when every token of the verify/prefill window ranks it at or below
# `route_tail_skip_rank` among its top-k picks. The other picks keep their
# weights (no renormalisation); the top pick of a token is never dropped.
# Fewer expert fetches per token, at a cost in quality. Lossy.
route_tail_skip = false
# Rank 0 is a token's best pick. At least 1; capped at k-1 of the window's
# longest pick list, so a model with fewer picks than the rank (DSV4 picks 6)
# still skips its last-ranked experts. Lower = more skipped = faster and worse.
route_tail_skip_rank = 7
# Measured loss, decode-style (one token per routing window), on the CPU host
# forward where every expert counts as a miss; Qwen3.8-Flash-Next GSQ-RCO Q2_0
# (10 picks per token), 8 English paragraphs, ~380 positions, KL of the run
# against the exact run in nats per token, and how often both pick the same
# top token:
#   rank 9: 0.0264, 92.2%    (drops only the last-ranked pick)
#   rank 8: 0.0477, 88.0%
#   rank 7: 0.0778, 83.9%
# A real run only skips experts that actually miss the cache, so its loss is
# lower than this, by an amount that depends on the miss rate; nobody has
# measured that yet, and the speed gain has not been measured either. Batch
# windows (prefill, verify) skip less than a single token does. Skipped
# experts get no cache heat, so an expert that only ever ranks in the tail is
# never cached. Check the quality on your own prompts before relying on it.

# Latent sparse attention (LSA, arXiv 2610.42147, flat search): once a row of
# a full-attention layer sees more than 4 + lsa_top_k + 512 keys, it reads
# only the first 4 keys, the last 512 and the `lsa_top_k` keys an index picks
# for it, instead of all of them. The index groups each layer's cached keys
# into buckets (Ward's method, in blocks of 512 keys) in a 64-dim space given
# by `lsa_map`; a query scores the bucket centroids and reads the keys of the
# best ones. Shorter contexts are untouched. Lossy.
#
# What a row reads depends only on its position and its own sequence, so
# within a run speculative output still equals plain output and concurrent
# requests equal solo ones; `/stats` counts the rows in `lsa_sparse_rows`.
#
# Needs: a model whose heads rotate only a prefix of their dims (Qwen3.5 /
# Qwen3.8: 64 of 256), its index maps as safetensors (`<layer>.W_Q_idx` and
# `<layer>.W_K_idx`, [position-free key dims, index dims] each; the paper's
# release `d-lsa-weights-v1` has Qwen3.8-27B's as a .pt file), and the whole
# model on local HIP GPUs with every KV page in VRAM (no cpu_only, no RPC
# workers; raise `[kv] vram_bytes` for long contexts). It does not shrink the
# KV cache: it adds about 40 bytes per key and layer in host memory.
# lsa = false
# lsa_top_k = 4096
# lsa_map = "maps/qwen38_27b.safetensors"
#
# Measured, Qwen3.8-27B UD-Q5_K_XL, lsa_top_k 4096, one KV page per layer
# (`[kv] page_tokens` at least the context), no speculation, one run each,
# against full attention on the same prompt (War and Peace plus a question):
#   prompt     machine   prefill s (full -> LSA)   decode ms/token (full -> LSA)
#   ~15k       xeres     162  -> 157               77.2  -> 77-79
#   ~30k       xeres     418  -> 335               81-86 -> 79-82
#   ~30k       shodan    578  -> 497               123.1 -> 115.4
#   ~122k      shodan    4350 -> 2052              183.7 -> 119.7
# Quality on those prompts: a sentence hidden at 10%, 50% and 90% of a ~30k
# prompt, and at 50% of a ~122k one, was quoted back by both; over the 27 to
# 81 steps where both runs had produced the same text, the KL of LSA's
# next-token distribution against full attention's was 0.005-0.007 nats per
# token at ~30k and 0.015 at ~122k, and the top token agreed on all but the
# step where the texts part. That is one book and one kind of question:
# check your own prompts. Below ~15k tokens it gains nothing.

# Overlay pipeline-mode defaults. Uncomment only the flags you want to force.
# [features]
# asymmetric_drafting = true
